<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузчик YouTube</title>
    <style>
        /* Базовые стили: строгая монохромная тема */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер-карточка */
        .card {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            text-align: center;
            box-sizing: border-box;
            margin: 20px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Поле ввода */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 24px;
            background-color: #000;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #888;
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        /* Контейнер для кнопок */
        .button-group {
            display: flex;
            gap: 16px;
            justify-content: space-between;
        }

        /* Кнопки */
        button {
            flex: 1;
            padding: 14px;
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #444;
            border-color: #666;
        }

        button:disabled {
            background-color: #111;
            color: #555;
            cursor: not-allowed;
            border-color: #222;
        }

        /* Блок для вывода ошибок */
        #error-message {
            margin-top: 20px;
            color: #ccc;
            font-size: 14px;
            min-height: 20px;
        }

        /* Адаптивность для телефонов */
        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
            }
            .card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Загрузка медиа</h1>
        <input type="text" id="url-input" placeholder="Вставьте ссылку на YouTube...">
        
        <div class="button-group">
            <button id="btn-audio" onclick="downloadMedia('audio')">Скачать MP3</button>
            <button id="btn-video" onclick="downloadMedia('video')">Скачать MP4</button>
        </div>

        <div id="error-message"></div>
    </div>

    <script>
        /**
         * Функция обработки запроса на скачивание
         * @param {string} type - Тип медиа ('audio' или 'video')
         */
        async function downloadMedia(type) {
            const urlInput = document.getElementById('url-input').value.trim();
            const errorDiv = document.getElementById('error-message');
            const btnAudio = document.getElementById('btn-audio');
            const btnVideo = document.getElementById('btn-video');
            
            // Сброс состояния
            errorDiv.textContent = '';
            if (!urlInput) {
                errorDiv.textContent = 'Пожалуйста, введите ссылку.';
                return;
            }

            // Блокировка кнопок на время загрузки
            const activeBtn = type === 'audio' ? btnAudio : btnVideo;
            const originalText = activeBtn.textContent;
            
            btnAudio.disabled = true;
            btnVideo.disabled = true;
            activeBtn.textContent = 'Обработка...';

            try {
                // Отправка POST запроса на бэкенд
                const response = await fetch('/download_media', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: urlInput, type: type })
                });

                // Если сервер вернул ошибку, парсим JSON и выводим
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Произошла неизвестная ошибка');
                }

                // Извлекаем имя файла из заголовка Content-Disposition
                let filename = type === 'audio' ? 'download.mp3' : 'download.mp4';
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.includes('filename=')) {
                    const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
                    if (matches != null && matches[1]) { 
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                // Преобразуем ответ в Blob для скачивания
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                
                // Создаем невидимую ссылку для инициации скачивания браузером
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                // Очистка
                window.URL.revokeObjectURL(downloadUrl);
                document.body.removeChild(a);

            } catch (error) {
                errorDiv.textContent = error.message;
            } finally {
                // Возвращаем кнопки в исходное состояние
                btnAudio.disabled = false;
                btnVideo.disabled = false;
                activeBtn.textContent = originalText;
            }
        }
    </script>

</body>
</html>
